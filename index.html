
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СМАРТ-КАЛЬКУЛЯТОР</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .calculator {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a4a4a;
            font-size: 14px;
            font-weight: 500;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #f9fafb;
            transition: border-color 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #4f2f3c;
            background-color: #ffffff;
        }
        select:disabled, input:disabled {
            background-color: #e5e7eb;
            color: #6b7280;
            cursor: not-allowed;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }
        .radio-group input {
            width: auto;
            margin-right: 8px;
        }
        .mechanism-info {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
            font-style: italic;
        }
        #fabric-list-container {
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #d1d5db;
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 10;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .fabric-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f3f4f6;
        }
        .fabric-item:hover {
            background-color: #faf5f7;
        }
        .fabric-item .fabric-price {
            float: right;
            color: #6b7280;
            font-size: 12px;
        }
        
        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #ffffff 0%, #faf5f7 100%);
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e2d3d8;
        }
        .result-label {
            color: #4f2f3c;
            font-size: 15px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .result-price {
            font-size: 32px;
            font-weight: 700;
            color: #4f2f3c;
            margin: 10px 0;
        }
        .details-small {
            font-size: 12px;
            color: #4b5563;
        }
    
        input[type="radio"] {
            accent-color: #4f2f3c;
        }
</style>

    function initApp() {
        const modelSelect = document.getElementById('model');
        modelSelect.innerHTML = '<option value="">-- Выберите модель --</option>';
        Object.keys(db.models).forEach(model => {
            let opt = document.createElement('option');
            opt.value = model;
            opt.textContent = model;
            modelSelect.appendChild(opt);
        });
        
        window.fabricsList = db.fabrics;
        renderFabricList(window.fabricsList);
        
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'fabric_input' && e.target.className !== 'fabric-item') {
                document.getElementById('fabric-list-container').style.display = 'none';
            }
        });
    }

    function updateConfigs() {
        const model = document.getElementById('model').value;
        const configGroup = document.getElementById('config-group');
        const mechDisplay = document.getElementById('mechanism-display');
        configGroup.innerHTML = '';
        
        if (!model) {
            mechDisplay.textContent = 'Механизм: выберите модель';
            updateArmrests();
            return;
        }

        const configs = Object.keys(db.models[model]);
        
        configs.forEach((conf, index) => {
            const label = document.createElement('label');
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'config';
            radio.value = conf;
            if (index === 0) radio.checked = true;
            radio.onchange = updateArmrests;
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(conf));
            configGroup.appendChild(label);
        });
        
        updateArmrests();
    }

    function updateArmrests() {
        const model = document.getElementById('model').value;
        const configRadio = document.querySelector('input[name="config"]:checked');
        const armrestSelect = document.getElementById('armrest');
        const mechDisplay = document.getElementById('mechanism-display');
        
        armrestSelect.innerHTML = '';
        
        if (!model || !configRadio) {
            armrestSelect.innerHTML = '<option value="">-- Сначала выберите комплектацию --</option>';
            updateSizes();
            return;
        }
        
        const config = configRadio.value;
        const configData = db.models[model][config];
        
        mechDisplay.textContent = 'Механизм раскладки: ' + configData.mechanism;
        
        const armrests = Object.keys(configData.armrests);
        armrests.forEach(arm => {
            let opt = document.createElement('option');
            opt.value = arm;
            opt.textContent = arm;
            armrestSelect.appendChild(opt);
        });
        
        updateSizes();
    }

    function updateSizes() {
        const model = document.getElementById('model').value;
        const configRadio = document.querySelector('input[name="config"]:checked');
        const armrest = document.getElementById('armrest').value;
        const sizeSelect = document.getElementById('sleeping_area');
        
        sizeSelect.innerHTML = '';
        
        if (!model || !configRadio || !armrest) {
            sizeSelect.innerHTML = '<option value="">-- Выберите подлокотники --</option>';
            updateDimensions();
            return;
        }
        
        const config = configRadio.value;
        const sizes = Object.keys(db.models[model][config].armrests[armrest]);
        
        sizes.forEach(size => {
            let opt = document.createElement('option');
            opt.value = size;
            opt.textContent = size;
            sizeSelect.appendChild(opt);
        });
        
        if (sizes.length <= 1) {
            sizeSelect.disabled = true;
        } else {
            sizeSelect.disabled = false;
        }
        
        updateDimensions();
    }

    function updateDimensions() {
        const model = document.getElementById('model').value;
        const configRadio = document.querySelector('input[name="config"]:checked');
        const armrest = document.getElementById('armrest').value;
        const size = document.getElementById('sleeping_area').value;
        const dimInput = document.getElementById('dimensions');
        
        if (!model || !configRadio || !armrest || !size) {
            dimInput.value = '';
            calculate();
            return;
        }
        
        const config = configRadio.value;
        const dimStr = db.models[model][config].armrests[armrest][size].dimensions;
        dimInput.value = dimStr;
        
        calculate();
    }

    function renderFabricList(fabrics) {
        const container = document.getElementById('fabric-list-container');
        container.innerHTML = '';
        
        fabrics.forEach(f => {
            const div = document.createElement('div');
            div.className = 'fabric-item';
            div.innerHTML = `${f.name} <span class="fabric-price">${f.price} ₽</span>`;
            div.onclick = function() {
                document.getElementById('fabric_input').value = f.name;
                document.getElementById('selected_fabric_price').value = f.price;
                container.style.display = 'none';
                calculate();
            };
            container.appendChild(div);
        });
    }

    
    // Simple transliteration map (ru -> en) to help finding english names using russian layout
    const ru2en = {
        'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'e', 'ж': 'zh', 
        'з': 'z', 'и': 'i', 'й': 'i', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o', 
        'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c', 
        'ч': 'ch', 'ш': 'sh', 'щ': 'sh', 'ъ': 'sh', 'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'u', 
        'я': 'ya'
    };
    
    // Additional direct phonetic mappings for common fabric prefixes
    const phoneticMap = {
        'альп': 'alp',
        'соул': 'soul',
        'фиест': 'fiest',
        'богем': 'bogem',
        'сонат': 'sonat',
        'олив': 'olivi',
        'бохо': 'boho',
        'лин': 'lin',
        'али': 'ali',
        'альф': 'alfa',
        'амальф': 'amalf',
        'ангор': 'angor',
        'арес': 'ares',
        'эклипс': 'eclips',
        'хани': 'honey',
        'бонит': 'bonita',
        'дельт': 'delta',
        'дион': 'dion',
        'канзас': 'kanzas',
        'ламб': 'lamb',
        'ларсен': 'larsen',
        'молли': 'molly',
        'мираж': 'mirag',
        'мист': 'mist',
        'оникс': 'onix',
        'ронд': 'rond',
        'мистрал': 'mistral',
        'паллад': 'pallad',
        'соффи': 'soffi',
        'сели': 'selia',
        'ван бастен': 'van basten'
    };

    function transliterate(word) {
        // Check phonetic map first
        for (let key in phoneticMap) {
            if (word.startsWith(key)) return word.replace(key, phoneticMap[key]);
        }
        return word.split('').map(char => ru2en[char] || char).join('');
    }

    
    function toggleFabricInput() {
        const type = document.querySelector('input[name="fabric_type"]:checked').value;
        const fabricInput = document.getElementById('fabric_input');
        if (type === 'sklad') {
            fabricInput.value = '';
            fabricInput.disabled = true;
            document.getElementById('selected_fabric_price').value = '';
            document.getElementById('fabric-list-container').style.display = 'none';
        } else {
            fabricInput.disabled = false;
        }
        calculate();
    }

    function filterFabrics() {
        const inputRaw = document.getElementById('fabric_input').value.toLowerCase();
        const inputTranslit = transliterate(inputRaw);
        
        const filtered = window.fabricsList.filter(f => {
            const nameLower = f.name.toLowerCase();
            return nameLower.includes(inputRaw) || nameLower.includes(inputTranslit);
        });
        
        renderFabricList(filtered);
        document.getElementById('fabric-list-container').style.display = 'block';
    }
function showFabrics() {
        filterFabrics(); 
        document.getElementById('fabric-list-container').style.display = 'block';
    }

    
    function calculate() {
        const model = document.getElementById('model').value;
        const configRadio = document.querySelector('input[name="config"]:checked');
        const armrest = document.getElementById('armrest').value;
        const size = document.getElementById('sleeping_area').value;
        
        // Получаем тип ткани
        const fabricType = document.querySelector('input[name="fabric_type"]:checked').value;
        const fabricPriceRaw = document.getElementById('selected_fabric_price').value;
        
        const resultEl = document.getElementById('final-price');
        const detailsEl = document.getElementById('calculation-details');

        if (!model || !configRadio || !armrest || !size) {
            resultEl.textContent = '0 ₽';
            detailsEl.textContent = 'Заполните все параметры дивана';
            return;
        }
        
        if (fabricType === 'zakaz' && !fabricPriceRaw) {
            resultEl.textContent = '0 ₽';
            detailsEl.textContent = 'Выберите заказную ткань';
            return;
        }

        const config = configRadio.value;
        const itemData = db.models[model][config].armrests[armrest][size];
        
        try {
            let finalPrice = 0;
            let infoText = '';

            if (fabricType === 'sklad') {
                finalPrice = itemData.sklad_price;
                if (!finalPrice) {
                    resultEl.textContent = '—';
                    detailsEl.textContent = 'Для данной модели нет складской программы';
                    return;
                }
                infoText = `Складская программа`;
            } else {
                const prices = itemData.prices;
                const stepAmount = itemData.step;
                const p = parseFloat(fabricPriceRaw);
                
                if (p <= 250) { finalPrice = prices["250"]; infoText = `до 250 руб.`; }
                else if (p <= 300) { finalPrice = prices["300"]; infoText = `до 300 руб.`; }
                else if (p <= 350) { finalPrice = prices["350"]; infoText = `до 350 руб.`; }
                else if (p <= 400) { finalPrice = prices["400"]; infoText = `до 400 руб.`; }
                else if (p <= 450) { finalPrice = prices["450"]; infoText = `до 450 руб.`; }
                else if (p <= 500) { finalPrice = prices["500"]; infoText = `до 500 руб.`; }
                else if (p <= 550) { finalPrice = prices["550"]; infoText = `до 550 руб.`; }
                else if (p <= 600) { finalPrice = prices["600"]; infoText = `до 600 руб.`; }
                else {
                    let basePrice = prices["600"];
                    let extra = p - 600;
                    let stepsCount = Math.ceil(extra / 50);
                    finalPrice = basePrice + (stepsCount * stepAmount);
                    infoText = `${p} руб. (База 600 + ${stepsCount} шаг. по ${stepAmount}р)`;
                }
                infoText = `Ткань: ${fabricPriceRaw} руб/м. Расчет по категории: ${infoText}`;
            }
            
            // Логика наличных/безнала
            const paymentMethod = document.querySelector('input[name="payment"]:checked');
            if (paymentMethod && paymentMethod.value === "cashless") {
                finalPrice = finalPrice * 1.09;
                finalPrice = Math.round(finalPrice / 100) * 100;
                infoText += ` | Безнал (+9%)`;
            } else {
                infoText += ` | Наличный расчет`;
            }
            
            if (finalPrice && !isNaN(finalPrice)) {
                resultEl.textContent = finalPrice.toLocaleString('ru-RU') + ' ₽';
                detailsEl.innerHTML = infoText;
            } else {
                resultEl.textContent = '—';
                detailsEl.textContent = 'Нет цены для данной комбинации';
            }
        } catch (e) {
            resultEl.textContent = 'Ошибка расчета';
            console.error(e);
        }
    }

    window.onload = initApp;
</script>


<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(registration) {
            console.log('ServiceWorker зарегистрирован: ', registration.scope);
        }).catch(function(err) {
            console.log('Ошибка регистрации ServiceWorker: ', err);
        });
    });
}
</script>
